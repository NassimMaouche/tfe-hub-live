<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion – TFE Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center">
      <a href="/" class="flex items-center gap-2 font-semibold text-slate-900">
        <span class="w-7 h-7 rounded bg-slate-900 text-white text-xs flex items-center justify-center font-bold">TH</span>
        TFE Hub
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
      <h1 class="text-xl font-bold text-slate-900 mb-1">Connexion</h1>
      <p class="text-sm text-slate-500 mb-6">Accède à ton compte étudiant</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="mb-4 text-sm px-3 py-2 rounded-lg border
          {% if cat=='error' %}bg-red-50 border-red-200 text-red-700{% else %}bg-emerald-50 border-emerald-200 text-emerald-700{% endif %}">
          {{ msg }}
        </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" class="space-y-4 bg-white border border-slate-200 rounded-lg p-6">
        <div>
          <label class="label">Pseudo ou email</label>
          <input type="text" name="login" required class="input" autofocus />
        </div>
        <div>
          <label class="label">Mot de passe</label>
          <input type="password" name="password" required class="input" />
        </div>
        <button type="submit" class="btn-primary w-full py-2.5">Se connecter</button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-4">
        Pas encore de compte ?
        <a href="{{ url_for('register') }}" class="text-sky-600 hover:underline font-medium">Créer un compte</a>
      </p>
    </div>
  </main>
</body>
</html>
