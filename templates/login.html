<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion – TFE Hub</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav">
    <div class="wrap" style="display:flex;width:100%;align-items:center;">
      <span class="logo"><span class="logo-badge">TH</span> TFE Hub</span>
    </div>
  </header>
  <main class="auth-page">
    <div class="auth-box">
      <h1 style="font-size:1.4rem;">Connexion obligatoire</h1>
      <p class="muted" style="margin-bottom:1rem;">
        Tu dois te connecter ou créer un compte pour accéder au site.
      </p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat if cat in ['error','success','warning'] else 'warning' }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST" class="card" style="display:flex;flex-direction:column;gap:0.85rem;">
        <div>
          <label class="label">Pseudo ou email</label>
          <input class="input" type="text" name="login" required autofocus autocomplete="username" />
        </div>
        <div>
          <label class="label">Mot de passe</label>
          <input class="input" type="password" name="password" required autocomplete="current-password" />
        </div>
        <button class="btn" type="submit" style="width:100%;">Se connecter</button>
      </form>
      <p class="muted" style="text-align:center;margin-top:1.25rem;font-size:0.95rem;">
        Pas encore de compte ?<br />
        <a href="{{ url_for('register') }}" style="font-weight:600;font-size:1rem;">Créer un compte →</a>
      </p>
    </div>
  </main>
</body>
</html>
