<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un compte – TFE Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #faf6eb; color: #3d3429; }
    h1 { font-family: 'Libre Baskerville', Georgia, serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b" style="background:#fffdf7;border-color:#e0d4bc;">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center">
      <span class="flex items-center gap-2 font-semibold" style="color:#3d3429;">
        <span class="w-7 h-7 rounded text-xs flex items-center justify-center font-bold"
          style="background:#5c4a32;color:#faf6eb;">TH</span>
        TFE Hub
      </span>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
      <h1 class="text-xl font-bold mb-1" style="color:#3d3429;">Créer un compte</h1>
      <p class="text-sm mb-6" style="color:#6b5e4f;">Obligatoire pour accéder aux projets et au chat.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="mb-3 text-sm px-3 py-2 rounded-lg border"
          style="{% if cat=='error' %}background:#fef2f2;border-color:#fecaca;color:#991b1b;
          {% else %}background:#f0fdf4;border-color:#bbf7d0;color:#166534;{% endif %}">
          {{ msg }}
        </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" class="space-y-3 rounded-lg p-6 border" style="background:#fffdf7;border-color:#e0d4bc;">
        <div>
          <label class="label">Pseudo *</label>
          <input type="text" name="username" required minlength="3" class="input"
            value="{{ username or '' }}" placeholder="ex: nassim" />
        </div>
        <div>
          <label class="label">Email *</label>
          <input type="email" name="email" required class="input"
            value="{{ email or '' }}" placeholder="toi@ecole.be" />
        </div>
        <div>
          <label class="label">Mot de passe *</label>
          <input type="password" name="password" required minlength="6" class="input" placeholder="min. 6 caractères" />
        </div>
        <div>
          <label class="label">Confirmer le mot de passe *</label>
          <input type="password" name="password2" required class="input" />
        </div>
        <button type="submit" class="btn-primary w-full py-2.5 mt-1">Créer mon compte</button>
      </form>

      <p class="text-center text-sm mt-4" style="color:#6b5e4f;">
        Déjà un compte ?
        <a href="{{ url_for('login') }}" class="font-medium hover:underline" style="color:#a68b3d;">Se connecter</a>
      </p>
    </div>
  </main>
</body>
</html>
