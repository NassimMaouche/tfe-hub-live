<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Créer un compte – TFE Hub</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav">
    <div class="wrap" style="display:flex;width:100%;align-items:center;">
      <span class="logo"><span class="logo-badge">TH</span> TFE Hub</span>
    </div>
  </header>
  <main class="auth-page">
    <div class="auth-box">
      <h1 style="font-size:1.35rem;">Créer un compte</h1>
      <p class="muted" style="margin-bottom:1.25rem;">Obligatoire pour accéder aux projets et messages.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat if cat in ['error','success','warning'] else 'error' }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST" class="card" style="display:flex;flex-direction:column;gap:0.75rem;">
        <div>
          <label class="label">Pseudo *</label>
          <input class="input" type="text" name="username" required minlength="3" value="{{ username or '' }}" placeholder="ex: nassim" />
        </div>
        <div>
          <label class="label">Email *</label>
          <input class="input" type="email" name="email" required value="{{ email or '' }}" />
        </div>
        <div>
          <label class="label">Mot de passe * (min. 6)</label>
          <input class="input" type="password" name="password" required minlength="6" />
        </div>
        <div>
          <label class="label">Confirmer le mot de passe *</label>
          <input class="input" type="password" name="password2" required />
        </div>
        <button class="btn" type="submit" style="width:100%;margin-top:0.25rem;">Créer mon compte</button>
      </form>
      <p class="muted" style="text-align:center;margin-top:1rem;">
        Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
      </p>
    </div>
  </main>
</body>
</html>
